name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - dev-murtaza

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.VPS_HOST }} << 'EOF'
            set -e

            cd /var/www/hyper-thread

            echo ">>> Pulling latest code..."
            git pull origin dev-murtaza

            echo ">>> Installing backend dependencies..."
            cd /var/www/hyper-thread/backend
            npm install

            echo ">>> Restarting backend with PM2..."
            pm2 restart news-backend

            echo ">>> Installing frontend dependencies..."
            cd /var/www/hyper-thread/frontend
            npm install

            echo ">>> Building frontend..."
            npm run build

            echo ">>> Restarting frontend with PM2..."
            pm2 restart news-frontend

            echo ">>> Reloading Nginx..."
            sudo systemctl reload nginx

            echo ">>> Deployment complete!"
          EOF
